{% extends "base.html" %}
{% block title %}Send an Inquiry — Interior Company{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-kicker">GET IN TOUCH</div>
    <h1 class="auth-title">Send Us an Inquiry</h1>
    <p class="auth-sub">Have a question, or want to tell us about your space before booking? Send a message and we'll reply by email.</p>

    <form method="POST" action="{{ url_for('inquiry') }}">
      <div class="form-row">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.full_name or '' }}" required>
      </div>
      <div class="form-row two-col">
        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" value="{{ form.email or '' }}" required>
        </div>
        <div>
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}">
        </div>
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us about your project…" required>{{ form.message or '' }}</textarea>
      </div>
      <button type="submit" class="btn-solid">SEND MESSAGE</button>
    </form>
  </div>
</section>
{% endblock %}
