{% extends "base.html" %}
{% block title %}Book a Consultation — Interior Company{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card wide">
    <div class="auth-kicker">CONSULTATION</div>
    <h1 class="auth-title">Book a Design Consultation</h1>
    <p class="auth-sub">Tell us a bit about your space and we'll take it from there.</p>

    <form method="POST" action="{{ url_for('book_consultation') }}">
      <div class="form-row two-col">
        <div>
          <label>Full Name</label>
          <input type="text" value="{{ user['Full Name'] }}" disabled style="background:#f0f0ee;color:#999;">
        </div>
        <div>
          <label>Phone</label>
          <input type="text" value="{{ user['Phone'] }}" disabled style="background:#f0f0ee;color:#999;">
        </div>
      </div>

      <div class="form-row">
        <label for="service_type">Service Type</label>
        <select id="service_type" name="service_type" required>
          <option value="" disabled {% if not form.service_type %}selected{% endif %}>Choose a service…</option>
          {% for s in services %}
            <option value="{{ s }}" {% if form.service_type == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row two-col">
        <div>
          <label for="preferred_date">Preferred Date</label>
          <input type="date" id="preferred_date" name="preferred_date" value="{{ form.preferred_date or '' }}" required>
        </div>
        <div>
          <label for="preferred_time">Preferred Time</label>
          <input type="time" id="preferred_time" name="preferred_time" value="{{ form.preferred_time or '' }}">
        </div>
      </div>

      <div class="form-row">
        <label for="address">Project Address</label>
        <input type="text" id="address" name="address" value="{{ form.address or user['Address'] or '' }}" placeholder="Where is the project located?" required>
      </div>

      <div class="form-row">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" placeholder="Room size, style preferences, budget range, timeline…">{{ form.notes or '' }}</textarea>
      </div>

      <button type="submit" class="btn-solid">BOOK CONSULTATION</button>
    </form>

    <div class="auth-foot"><a href="{{ url_for('dashboard') }}">← Back to My Account</a></div>
  </div>
</section>
{% endblock %}
