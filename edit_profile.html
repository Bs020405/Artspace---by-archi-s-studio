{% extends "base.html" %}
{% block title %}Edit Profile — Interior Company{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-kicker">MY ACCOUNT</div>
    <h1 class="auth-title">Edit Profile</h1>
    <p class="auth-sub">Update your contact details below.</p>

    <form method="POST" action="{{ url_for('edit_profile') }}">
      <div class="form-row">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form['Full Name'] or form.full_name or '' }}" required>
      </div>
      <div class="form-row">
        <label>Email Address</label>
        <input type="email" value="{{ user['Email'] }}" disabled style="background:#f0f0ee;color:#999;">
        <div class="form-hint">Email address cannot be changed. Contact us if you need help.</div>
      </div>
      <div class="form-row">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ form['Phone'] or form.phone or '' }}" required>
      </div>
      <div class="form-row">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ form['Address'] or form.address or '' }}">
      </div>
      <button type="submit" class="btn-solid">SAVE CHANGES</button>
    </form>

    <div class="auth-foot"><a href="{{ url_for('dashboard') }}">← Back to My Account</a></div>
  </div>
</section>
{% endblock %}
