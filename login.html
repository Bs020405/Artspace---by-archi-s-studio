{% extends "base.html" %}
{% block title %}Login — Interior Company{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-kicker">INTERIOR COMPANY</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Log in to view your bookings and manage your profile.</p>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="form-row">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" value="{{ form.email or '' }}" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn-solid">LOG IN</button>
    </form>

    <div class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></div>
  </div>
</section>
{% endblock %}
