{% extends "base.html" %}
{% block title %}Create Account — Interior Company{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-kicker">INTERIOR COMPANY</div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-sub">Register to book consultations and track your projects.</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-row">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.full_name or '' }}" placeholder="Jane Doe" required>
      </div>
      <div class="form-row">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" value="{{ form.email or '' }}" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}" placeholder="+91 98765 43210" required>
      </div>
      <div class="form-row">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ form.address or '' }}" placeholder="City, State">
      </div>
      <div class="form-row two-col">
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
        </div>
        <div>
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
        </div>
      </div>
      <button type="submit" class="btn-solid">CREATE ACCOUNT</button>
    </form>

    <div class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
</section>
{% endblock %}
